<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>ASC Production - Заявки</title>
    <script src="https://telegram.org/js/telegram-web-app.js"></script>
    <link rel="stylesheet" href="styles.css">
</head>
<body>
    <div id="app">
        <!-- Навигация -->
        <nav class="navbar">
            <button class="nav-btn active" data-page="create">📝 Создать заявку</button>
            <button class="nav-btn" data-page="track">📊 Мои заявки</button>
        </nav>

        <!-- Страница создания заявки -->
        <div id="create-page" class="page active">
            <div class="container">
                <h1>Новая заявка</h1>
                
                <form id="project-form">
                    <!-- Тип проекта -->
                    <div class="form-group">
                        <label>Тип проекта *</label>
                        <select id="project_type" required>
                            <option value="">Выберите тип</option>
                            <option value="Лонгрид для YouTube">Лонгрид для YouTube</option>
                            <option value="Подкаст/интервью">Подкаст/интервью</option>
                            <option value="Образовательный контент">Образовательный контент</option>
                            <option value="Рекламный ролик">Рекламный ролик</option>
                            <option value="Другое">Другое</option>
                        </select>
                    </div>

                    <!-- Длительность исходного материала -->
                    <div class="form-group">
                        <label>Длительность исходного материала *</label>
                        <input type="text" id="duration_raw" placeholder="Например: 2 часа" required>
                    </div>

                    <!-- Длительность готового видео -->
                    <div class="form-group">
                        <label>Длительность готового видео *</label>
                        <input type="text" id="duration_final" placeholder="Например: 10-12 минут" required>
                    </div>

                    <!-- Услуги -->
                    <div class="form-group">
                        <label>Услуги *</label>
                        <div class="checkbox-group">
                            <label><input type="checkbox" name="services" value="Монтаж"> Монтаж</label>
                            <label><input type="checkbox" name="services" value="Обработка звука"> Обработка звука</label>
                            <label><input type="checkbox" name="services" value="Графика"> Графика</label>
                            <label><input type="checkbox" name="services" value="Моушн-дизайн"> Моушн-дизайн</label>
                            <label><input type="checkbox" name="services" value="Цветокоррекция"> Цветокоррекция</label>
                        </div>
                    </div>

                    <!-- Срок сдачи -->
                    <div class="form-group">
                        <label>Срок сдачи *</label>
                        <select id="deadline" required>
                            <option value="">Выберите срок</option>
                            <option value="Срочно (1-3 дня)">Срочно (1-3 дня)</option>
                            <option value="Стандартно (7-10 дней)">Стандартно (7-10 дней)</option>
                            <option value="Не срочно (2+ недели)">Не срочно (2+ недели)</option>
                        </select>
                    </div>

                    <!-- Бюджет -->
                    <div class="form-group">
                        <label>Бюджет *</label>
                        <input type="text" id="budget" placeholder="Например: 20-30К" required>
                    </div>

                    <!-- Ссылки на исходники -->
                    <div class="form-group">
                        <label>Ссылки на исходники</label>
                        <textarea id="source_links" rows="3" placeholder="Вставьте ссылки на файлы (Google Drive, Яндекс.Диск и т.д.)"></textarea>
                    </div>

                    <!-- Примеры стиля -->
                    <div class="form-group">
                        <label>Примеры стиля</label>
                        <textarea id="style_examples" rows="3" placeholder="Ссылки на примеры или описание желаемого стиля"></textarea>
                    </div>

                    <!-- Дополнительные заметки -->
                    <div class="form-group">
                        <label>Дополнительные заметки</label>
                        <textarea id="additional_notes" rows="4" placeholder="Любая дополнительная информация"></textarea>
                    </div>

                    <button type="submit" class="btn-primary">Отправить заявку</button>
                </form>
            </div>
        </div>

        <!-- Страница отслеживания заявок -->
        <div id="track-page" class="page">
            <div class="container">
                <h1>Мои заявки</h1>
                <div id="projects-list">
                    <div class="loading">Загрузка...</div>
                </div>
            </div>
        </div>
    </div>

    <script src="app.js"></script>
</body>
</html>
